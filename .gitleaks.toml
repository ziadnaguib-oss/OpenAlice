# Secret scanning configuration (SE-4). Runs in CI on every PR/push and in the
# pre-commit hook when the gitleaks binary is installed locally.
#
# Extends the battle-tested default ruleset; entries below are repo-specific
# allowlist carve-outs, NOT weakened rules. Never allowlist real credential
# material — sealed stores and env files are already gitignored.

[extend]
useDefault = true

[allowlist]
description = "OpenAlice repo-specific false-positive carve-outs"
paths = [
  # Lockfile integrity hashes trip generic high-entropy detectors.
  '''pnpm-lock\.yaml''',
  # Spec fixtures use obviously-fake placeholder keys (sk-test…, PK…DEMO).
  '''\.spec\.ts$''',
  # Vendored/ported protocol reference material.
  '''packages/ibkr/ref/''',
]
regexTarget = "match"
regexes = [
  # Documented placeholder shapes used in docs and default templates.
  '''(?i)(your|placeholder|example|dummy|fake)[-_ ]?(api[-_ ]?key|token|secret)''',
]
